openapi: 3.0.3
info:
  title: CheckApp API
  description: 'API de CheckApp para la operación de seguridad de BARCELONA Residencial: usuarios, ubicaciones, rondas, kardex, incidencias, mantenimiento, casa club, propiedades, residentes, invitaciones, reportes y comunicación del equipo.'
  version: 1.1.0
servers:
- url: http://localhost:4444/api/v1
  description: Local
- url: https://axzy-checkapp-bonaterra-prod-api.up.railway.app/api/v1
  description: API desplegada (Railway)
tags:
- name: index
  description: Health check del API
- name: users
  description: Usuarios, roles y autenticación
- name: locations
  description: Zonas y puntos de ronda (QR)
- name: uploads
  description: Carga de evidencias a S3
- name: kardex
  description: Escaneos, evidencias y bitácora
- name: schedules
  description: Horarios de trabajo
- name: assignments
  description: Asignaciones y tareas
- name: recurring
  description: Rutinas y rutas recurrentes
- name: rounds
  description: Rondas de seguridad
- name: incidents
  description: Reportes de incidencias
- name: maintenance
  description: Reportes de mantenimiento
- name: club
  description: Reportes de Casa Club
- name: properties
  description: Propiedades del residencial
- name: residents
  description: Residentes y contactos
- name: invitations
  description: Invitaciones y pases de visita
- name: catalog
  description: Catálogos de lectura para combos
- name: catalog-admin
  description: Administración de categorías y tipos
- name: chat
  description: Chat del equipo operativo
- name: realtime
  description: Tokens de Ably para tiempo real
- name: shift-handover
  description: Entrega de turno
- name: uniform
  description: Revisión de uniforme y presentación
- name: dashboard
  description: Dashboard operativo en vivo
- name: reports
  description: Reportes de guardias y PDFs ejecutivos
paths:
  /users:
    get:
      tags:
      - users
      summary: Obtener todos los usuarios
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUserArray'
      security: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
        description: Filtra por nombre, apellido o usuario
    post:
      tags:
      - users
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUser'
      security: []
  /users/datatable:
    post:
      tags:
      - users
      summary: Obtener usuarios paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /users/login:
    post:
      tags:
      - users
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLogin'
        '401':
          description: Invalid credentials
      security: []
  /locations:
    get:
      tags:
      - locations
      summary: Listar locaciones
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLocationArray'
      security: []
    post:
      tags:
      - locations
      summary: Crear locación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LocationCreate'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLocation'
      security: []
  /locations/datatable:
    post:
      tags:
      - locations
      summary: Obtener locaciones paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /uploads:
    post:
      tags:
      - uploads
      summary: Subir archivo (Imagen o Video)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                location:
                  type: string
                  description: Texto opcional para el nombre del archivo
              required:
              - file
              additionalProperties: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUpload'
  /kardex:
    post:
      tags:
      - kardex
      summary: Crear registro de kardex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KardexCreate'
      responses:
        '201':
          description: Le Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultKardex'
    get:
      tags:
      - kardex
      summary: Listar kardex (filtros opcionales)
      parameters:
      - in: query
        name: userId
        schema:
          type: integer
      - in: query
        name: locationId
        schema:
          type: integer
      - in: query
        name: startDate
        schema:
          type: string
          format: date-time
      - in: query
        name: endDate
        schema:
          type: string
          format: date-time
      - name: userId
        in: query
        required: false
        schema:
          type: integer
      - name: locationId
        in: query
        required: false
        schema:
          type: integer
      - name: startDate
        in: query
        required: false
        schema:
          type: string
        description: ISO 8601
      - name: endDate
        in: query
        required: false
        schema:
          type: string
        description: ISO 8601
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultKardexArray'
  /kardex/{id}:
    get:
      tags:
      - kardex
      summary: Detalle de kardex
      parameters:
      - in: path
        name: id
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultKardex'
    patch:
      tags:
      - kardex
      summary: Editar escaneo
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KardexUpdate'
      responses:
        '200':
          description: Escaneo actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultKardex'
        '400':
          description: Solicitud inválida
        '404':
          description: No encontrado
        '500':
          description: Error interno
    delete:
      tags:
      - kardex
      summary: Eliminar escaneo
      description: No borra los archivos de S3.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Escaneo eliminado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultBoolean'
        '404':
          description: No encontrado
        '500':
          description: Error interno
  /schedules/datatable:
    post:
      tags:
      - schedules
      summary: Obtener horarios paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /assignments/datatable:
    post:
      tags:
      - assignments
      summary: Obtener asignaciones paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /rounds/datatable:
    post:
      tags:
      - rounds
      summary: Obtener rondines paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
  /incidents/datatable:
    post:
      tags:
      - incidents
      summary: Obtener incidencias paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /maintenance/datatable:
    post:
      tags:
      - maintenance
      summary: Obtener mantenimientos paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /properties:
    get:
      tags:
      - properties
      summary: Listar todas las propiedades
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultPropertyArray'
      security: []
    post:
      tags:
      - properties
      summary: Crear nueva propiedad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
      security: []
  /properties/datatable:
    post:
      tags:
      - properties
      summary: Obtener propiedades paginadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
      security: []
  /properties/{id}:
    get:
      tags:
      - properties
      summary: Detalle de propiedad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
      security: []
    put:
      tags:
      - properties
      summary: Actualizar propiedad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
      security: []
    delete:
      tags:
      - properties
      summary: Eliminar propiedad
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
      security: []
  /residents:
    get:
      tags:
      - residents
      summary: Listar todos los residentes con sus perfiles
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResidentArray'
      security: []
    post:
      tags:
      - residents
      summary: Registrar nuevo residente (Usuario + Perfil)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
      security: []
  /residents/{id}:
    get:
      tags:
      - residents
      summary: Detalle de residente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
      security: []
    put:
      tags:
      - residents
      summary: Actualizar residente y su perfil
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
      security: []
    delete:
      tags:
      - residents
      summary: Eliminar residente
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
      security: []
  /catalog-admin/categories:
    get:
      tags:
      - catalog-admin
      summary: Lista categorías de un catálogo (INCIDENT / MAINTENANCE / CASA_CLUB), incluidas inactivas
      parameters:
      - name: type
        in: query
        required: false
        schema:
          type: string
          enum:
          - INCIDENT
          - MAINTENANCE
          - CASA_CLUB
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
    post:
      tags:
      - catalog-admin
      summary: Crea una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCategoryCreate'
      responses:
        '201':
          description: Creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/categories/reorder:
    put:
      tags:
      - catalog-admin
      summary: Reordena categorías (arreglo de ids en el nuevo orden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/categories/{id}/pin:
    put:
      tags:
      - catalog-admin
      summary: Fija una categoría al inicio (acceso rápido)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/categories/{id}:
    put:
      tags:
      - catalog-admin
      summary: Actualiza una categoría
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogCategoryUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
    delete:
      tags:
      - catalog-admin
      summary: Elimina una categoría (se desactiva si tiene historial asociado)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/types:
    get:
      tags:
      - catalog-admin
      summary: Lista tipos de una categoría, incluidos inactivos
      parameters:
      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
    post:
      tags:
      - catalog-admin
      summary: Crea un tipo de incidencia bajo una categoría
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogTypeCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/types/reorder:
    put:
      tags:
      - catalog-admin
      summary: Reordena tipos dentro de una categoría (arreglo de ids en el nuevo orden)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/types/{id}/pin:
    put:
      tags:
      - catalog-admin
      summary: Fija un tipo al inicio de su categoría (acceso rápido)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /catalog-admin/types/{id}:
    put:
      tags:
      - catalog-admin
      summary: Actualiza un tipo (nombre, valor, categoría, activo)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CatalogTypeUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
    delete:
      tags:
      - catalog-admin
      summary: Elimina un tipo (se desactiva si tiene historial asociado)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /chat/messages:
    get:
      tags:
      - chat
      summary: Historial de mensajes, paginado por cursor (más recientes primero)
      parameters:
      - name: cursor
        in: query
        required: false
        schema:
          type: integer
        description: ID del mensaje más antiguo ya cargado
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          default: 30
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
      description: Requiere ADMIN, GUARD, SHIFT o MAINT.
    post:
      tags:
      - chat
      summary: Envía un mensaje al canal grupal del equipo operativo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatMessageCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
      description: Requiere ADMIN, GUARD, SHIFT o MAINT. Publica new-message en chat:team.
  /realtime/token:
    get:
      tags:
      - realtime
      summary: Emite un TokenRequest de Ably (solo-suscripción) para el usuario autenticado
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
        '503':
          description: Ably no configurado/disponible
  /shift-handover:
    post:
      tags:
      - shift-handover
      summary: Crea un reporte de entrega de turno con sus elementos (guardias)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShiftHandoverCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
      description: Requiere ADMIN o SHIFT.
  /shift-handover/datatable:
    post:
      tags:
      - shift-handover
      summary: Lista paginada de reportes de entrega de turno (WEB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
  /shift-handover/pending:
    get:
      tags:
      - shift-handover
      summary: Indica si el reporte de turno del día está pendiente de enviarse
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /shift-handover/{id}:
    get:
      tags:
      - shift-handover
      summary: Detalle de un reporte de entrega de turno
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /uniform:
    post:
      tags:
      - uniform
      summary: Registra un checklist de uniformidad/aseo para un guardia
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UniformCheckCreate'
      responses:
        '201':
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
      description: Requiere ADMIN o SHIFT.
  /uniform/datatable:
    post:
      tags:
      - uniform
      summary: Lista paginada de checklists de uniforme (WEB)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'
  /uniform/by-guard/{guardId}:
    get:
      tags:
      - uniform
      summary: Historial de checklists de uniforme de un guardia
      parameters:
      - name: guardId
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultGeneric'
  /dashboard/live:
    get:
      tags:
      - dashboard

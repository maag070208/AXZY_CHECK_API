openapi: 3.0.3

info:
  title: AXZY PARKING API
  description: API para control de estacionamiento, entradas, salidas, movimientos y evidencia.
  version: 1.0.0

servers:
  - url: http://localhost:4444/api/v1
    description: Local server

tags:
  - name: users
    description: Gestión de usuarios y roles
  - name: locations
    description: Gestión de cajones de estacionamiento
  - name: uploads
    description: Carga de archivos
  - name: kardex
    description: Registro de rondines y evidencia
  - name: schedules
    description: Gestión de horarios de trabajo
  - name: assignments
    description: Control de tareas y zonas asignadas
  - name: rounds
    description: Seguimiento de recorridos de seguridad
  - name: incidents
    description: Reporte de anomalías detectadas
  - name: maintenance
    description: Solicitudes y seguimiento de mantenimiento
  - name: properties
    description: Gestión de casas y departamentos
  - name: residents
    description: Gestión de perfiles de residentes y sus accesos
  - name: catalog
    description: Administración de catálogos (tipos de incidencia y mantenimiento)
  - name: dashboard
    description: Métricas y estadísticas del panel de control



paths:

  ###########################################################################
  # USERS
  ###########################################################################
  /users:
    get:
      tags: [users]
      summary: Obtener todos los usuarios
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUserArray'

    post:
      tags: [users]
      summary: Registrar nuevo usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        "201":
          description: Usuario creado exitosamente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUser'

  /users/datatable:
    post:
      tags: [users]
      summary: Obtener usuarios paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  /users/login:
    post:
      tags: [users]
      summary: Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLogin'
        "401":
          description: Invalid credentials

  ###########################################################################
  # LOCATIONS
  ###########################################################################
  /locations:
    get:
      tags: [locations]
      summary: Listar locaciones

      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLocationArray'
    post:
      tags: [locations]
      summary: Crear locación
      requestBody:
        required: true
        content:
          application/json:
            schema:
               type: object
               properties:
                 aisle: { type: string }
                 spot: { type: string }
                 number: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultLocation'

  /locations/datatable:
    post:
      tags: [locations]
      summary: Obtener locaciones paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # UPLOADS
  ###########################################################################
  /uploads:
    post:
      tags: [uploads]
      summary: Subir archivo (Imagen o Video)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultUpload'

  ###########################################################################
  # KARDEX
  ###########################################################################
  /kardex:
    post:
      tags: [kardex]
      summary: Crear registro de kardex
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KardexCreate'
      responses:
        "201":
           description: Le Created
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/TResultKardex'
    get:
      tags: [kardex]
      summary: Listar kardex (filtros opcionales)
      parameters:
        - in: query
          name: userId
          schema:
            type: integer
        - in: query
          name: locationId
          schema:
            type: integer
        - in: query
          name: startDate
          schema:
            type: string
            format: date-time
        - in: query
          name: endDate
          schema:
            type: string
            format: date-time
      responses:
         "200":
           description: OK
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/TResultKardexArray'
  
  /kardex/{id}:
    get:
      tags: [kardex]
      summary: Detalle de kardex
      parameters:
        - in: path
          name: id
          required: true
          schema: 
            type: integer
      responses:
         "200":
           description: OK
           content:
             application/json:
               schema:
                 $ref: '#/components/schemas/TResultKardex'




  ###########################################################################
  # SCHEDULES
  ###########################################################################
  /schedules/datatable:
    post:
      tags: [schedules]
      summary: Obtener horarios paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # ASSIGNMENTS
  ###########################################################################
  /assignments/datatable:
    post:
      tags: [assignments]
      summary: Obtener asignaciones paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # ROUNDS
  ###########################################################################
  /rounds/datatable:
    post:
      tags: [rounds]
      summary: Obtener rondines paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # INCIDENTS
  ###########################################################################
  /incidents/datatable:
    post:
      tags: [incidents]
      summary: Obtener incidencias paginadas con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # MAINTENANCE
  ###########################################################################
  /maintenance/datatable:
    post:
      tags: [maintenance]
      summary: Obtener mantenimientos paginados con filtros y ordenamiento
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  ###########################################################################
  # CATALOG MANAGEMENT (tipos de incidencia y mantenimiento)
  ###########################################################################
  /catalog/incident-categories:
    get:
      tags: [catalog]
      summary: Listar categorías de catálogo
      description: Por defecto sólo devuelve categorías activas. ADMIN puede pasar adminOnly=true para ver inactivas.
      parameters:
        - in: query
          name: type
          schema: { type: string, enum: [INCIDENT, MAINTENANCE] }
        - in: query
          name: adminOnly
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategoryArray' }
    post:
      tags: [catalog]
      summary: Crear una nueva categoría (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentCategoryDTO' }
      responses:
        "201":
          description: Categoría creada
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategory' }
        "400": { description: Validación o duplicado }

  /catalog/incident-categories/{id}:
    get:
      tags: [catalog]
      summary: Detalle de una categoría
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategory' }
        "404": { description: No encontrada }
    put:
      tags: [catalog]
      summary: Actualizar una categoría (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIncidentCategoryDTO' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategory' }
        "404": { description: No encontrada }
    delete:
      tags: [catalog]
      summary: Soft delete de una categoría (ADMIN)
      description: Marca active=false y desactiva también los tipos hijos.
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategory' }

  /catalog/incident-categories/{id}/activate:
    patch:
      tags: [catalog]
      summary: Reactivar una categoría desactivada (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentCategory' }

  /catalog/incident-types:
    get:
      tags: [catalog]
      summary: Listar tipos de catálogo
      parameters:
        - in: query
          name: categoryId
          schema: { type: integer }
        - in: query
          name: type
          schema: { type: string, enum: [INCIDENT, MAINTENANCE] }
        - in: query
          name: adminOnly
          schema: { type: boolean }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentTypeArray' }
    post:
      tags: [catalog]
      summary: Crear un nuevo tipo (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateIncidentTypeDTO' }
      responses:
        "201":
          description: Tipo creado
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentType' }
        "400": { description: Validación o duplicado }

  /catalog/incident-types/{id}:
    get:
      tags: [catalog]
      summary: Detalle de un tipo
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentType' }
    put:
      tags: [catalog]
      summary: Actualizar un tipo (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateIncidentTypeDTO' }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentType' }
    delete:
      tags: [catalog]
      summary: Soft delete de un tipo (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentType' }

  /catalog/incident-types/{id}/activate:
    patch:
      tags: [catalog]
      summary: Reactivar un tipo desactivado (ADMIN)
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TResultIncidentType' }

  ###########################################################################
  # DASHBOARD
  ###########################################################################
  /dashboard:
    get:
      tags: [dashboard]
      summary: Obtener métricas del panel de control
      description: Retorna conteos de propiedades, ubicaciones, guardias, rondas activas, incidencias pendientes, mantenimientos, asignaciones, rutas activas y actividad reciente.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDashboard'
  /dashboard/completed-rounds-today:
    get:
      tags: [dashboard]
      summary: Obtener rondas completadas hoy
      description: Retorna las rondas completadas en el día de hoy con tiempo de duración, escaneos y omisiones.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        guardName: { type: string }
                        routeName: { type: string }
                        startTime: { type: string, format: date-time }
                        endTime: { type: string, format: date-time }
                        durationMinutes: { type: integer }
                        totalLocations: { type: integer }
                        scannedLocations: { type: integer }
                        missedLocations: { type: integer }
                  messages: { type: array, items: { type: string } }

  ###########################################################################
  # PROPERTIES
  ###########################################################################
  /properties:
    get:
      tags: [properties]
      summary: Listar todas las propiedades
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultPropertyArray'
    post:
      tags: [properties]
      summary: Crear nueva propiedad
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyCreate'
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'

  /properties/datatable:
    post:
      tags: [properties]
      summary: Obtener propiedades paginadas
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataTableFetchParams'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultDataTable'

  /properties/{id}:
    get:
      tags: [properties]
      summary: Detalle de propiedad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
    put:
      tags: [properties]
      summary: Actualizar propiedad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PropertyUpdate'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'
    delete:
      tags: [properties]
      summary: Eliminar propiedad
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultProperty'

  ###########################################################################
  # RESIDENTS
  ###########################################################################
  /residents:
    get:
      tags: [residents]
      summary: Listar todos los residentes con sus perfiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResidentArray'
    post:
      tags: [residents]
      summary: Registrar nuevo residente (Usuario + Perfil)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentCreate'
      responses:
        "201":
          description: Creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'

  /residents/{id}:
    get:
      tags: [residents]
      summary: Detalle de residente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
    put:
      tags: [residents]
      summary: Actualizar residente y su perfil
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResidentUpdate'
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'
    delete:
      tags: [residents]
      summary: Eliminar residente
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TResultResident'

components:
  schemas:
    DataTableFetchParams:
      type: object
      properties:
        page: { type: integer, default: 1 }
        limit: { type: integer, default: 10 }
        filters: { type: object, additionalProperties: true }
        sort:
          type: object
          properties:
            key: { type: string }
            direction: { type: string, enum: [asc, desc] }

    TResultDataTable:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            rows: { type: array, items: { type: object } }
            total: { type: integer }
        messages: { type: array, items: { type: string } }

    ################################################################
    # TResult WRAPPERS
    ################################################################
    TResultString:
      type: object
      properties:
        data: { type: string }
        error: { type: string, nullable: true }

    TResultUser:
      type: object
      properties:
        data: { $ref: '#/components/schemas/User' }
        error: { type: string, nullable: true }

    TResultUserArray:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/User' }
        error: { type: string, nullable: true }

    TResultLogin:
      type: object
      properties:
        data: { type: string, description: JWT generado }
        error: { type: string, nullable: true }
    
    TResultLocation:
       type: object
       properties:
         data: { $ref: '#/components/schemas/Location' }
         error: { type: string, nullable: true }
    
    TResultLocationArray:
       type: object
       properties:
         data:
           type: array
           items: { $ref: '#/components/schemas/Location' }
         error: { type: string, nullable: true }

    TResultUpload:
       type: object
       properties:
         data:
           type: object
           properties:
             url: { type: string }
             mimetype: { type: string }
             size: { type: integer }
         error: { type: string, nullable: true }

    TResultKardex:
       type: object
       properties:
         data: { $ref: '#/components/schemas/Kardex' }
         error: { type: string, nullable: true }

    TResultKardexArray:
       type: object
       properties:
         data:
           type: array
           items: { $ref: '#/components/schemas/Kardex' }
         error: { type: string, nullable: true }



    ################################################################
    # ENTITIES
    ################################################################

    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        lastName: { type: string }
        username: { type: string }

        role: 
           type: string
           enum: [ADMIN, SHIFT_GUARD, GUARD, MANTENIMIENTO, RESIDENT]
    UserCreate:
      type: object
      required: [name, username, password]

      properties:
        name: { type: string }
        lastName: { type: string }
        username: { type: string }

        password: { type: string }
        role: 
           type: string
           enum: [ADMIN, SHIFT_GUARD, GUARD, MANTENIMIENTO, RESIDENT]
    UserLogin:
      type: object
      required: [username, password]

      properties:
        username: { type: string }

        password: { type: string }
    
    Location:
       type: object
       properties:
         id: { type: integer }
         name: { type: string }
         aisle: { type: string }
         spot: { type: string }
         number: { type: string }
         isOccupied: { type: boolean }
    
    Kardex:
       type: object
       properties:
         id: { type: integer }
         userId: { type: integer }
         locationId: { type: integer }
         timestamp: { type: string, format: date-time }
         notes: { type: string }
         media: 
           type: array
           items:
             type: object
             properties:
                type: { type: string, enum: [IMAGE, VIDEO] }
                url: { type: string }

    ################################################################
    # DASHBOARD SCHEMAS
    ################################################################
    TResultDashboard:
      type: object
      properties:
        success: { type: boolean }
        data:
          type: object
          properties:
            totalProperties: { type: integer, description: Total de propiedades activas }
            totalLocations: { type: integer, description: Total de ubicaciones activas }
            totalGuards: { type: integer, description: Total de guardias activos }
            totalUsers: { type: integer, description: Total de usuarios activos }
            activeRounds: { type: integer, description: Rondas en progreso }
            pendingIncidents: { type: integer, description: Incidencias pendientes }
            pendingMaintenance: { type: integer, description: Mantenimientos pendientes }
            activeAssignments: { type: integer, description: Asignaciones activas }
            activeRoutes: { type: integer, description: Rutas activas }
            recentActivity:
              type: array
              items:
                type: object
                properties:
                  id: { type: integer }
                  guardName: { type: string }
                  locationName: { type: string }
                  timestamp: { type: string, format: date-time }
                  scanType: { type: string }
        messages:
          type: array
          items: { type: string }

    ################################################################
    # PROPERTY SCHEMAS
    ################################################################
    TResultProperty:
      type: object
      properties:
        data: { $ref: '#/components/schemas/Property' }
        error: { type: string, nullable: true }

    TResultPropertyArray:
      type: object
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Property' }
        error: { type: string, nullable: true }

    Property:
      type: object
      properties:
        id: { type: integer }
        identifier: { type: string }
        name: { type: string }

          type: integer
          nullable: true
        user:
          type: object
          properties: {}
          additionalProperties: true
        location:
          $ref: '#/components/schemas/Location'
      additionalProperties: true
    TResultProperty:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Property'
        messages:
          type: array
          items:
            type: string
    TResultPropertyArray:

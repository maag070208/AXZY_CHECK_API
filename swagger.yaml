components:
  schemas:
    TResultGeneric:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties: {}
          additionalProperties: true
          nullable: true
        messages:
          type: array
          items:
            type: string
    DataTableFetchParams:
      type: object
      properties:
        page:
          type: integer
          default: 1
        limit:
          type: integer
          default: 10
        filters:
          type: object
          additionalProperties: true
        sort:
          type: object
          properties:
            key:
              type: string
            direction:
              type: string
              enum:
              - asc
              - desc
    TResultDataTable:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            rows:
              type: array
              items:
                type: object
                properties: {}
                additionalProperties: true
            total:
              type: integer
          additionalProperties: true
        messages:
          type: array
          items:
            type: string
    TResultString:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: string
        messages:
          type: array
          items:
            type: string
    TResultUser:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/User'
        messages:
          type: array
          items:
            type: string
    TResultUserArray:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/User'
        messages:
          type: array
          items:
            type: string
    TResultLogin:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: string
          description: JWT generado
        messages:
          type: array
          items:
            type: string
    TResultLocation:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Location'
        messages:
          type: array
          items:
            type: string
    TResultLocationArray:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Location'
        messages:
          type: array
          items:
            type: string
    TResultUpload:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            url:
              type: string
            type:
              type: string
              enum:
              - IMAGE
              - VIDEO
            mimetype:
              type: string
            size:
              type: integer
            bucket:
              type: string
            key:
              type: string
          additionalProperties: true
        messages:
          type: array
          items:
            type: string
    TResultKardex:
      type: object
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/Kardex'
        messages:
          type: array
          items:
            type: string
    TResultKardexArray:
      type: object
      properties:
        success:
          type: boolean
        data:
          type: array
          items:
            $ref: '#/components/schemas/Kardex'
        messages:
          type: array
          items:
            type: string
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        lastName:
          type: string
        username:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        roleId:
          type: integer
        scheduleId:
          type: integer
        propertyId:
          type: integer
        active:
          type: boolean
        isLoggedIn:
          type: boolean
        softDelete:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: true
    UserCreate:
      type: object
      properties:
        name:
          type: string
        lastName:
          type: string
        username:
          type: string
        password:
          type: string
          format: password

          type: string
        name:
          type: string
        mainStreet:
          type: string
        betweenStreets:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        typeId:
          type: integer
        statusId:
          type: integer
        type:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string
            value:
              type: string

          type: integer
        shiftStart:
          type: string
          example: 08:00
        shiftEnd:
          type: string
          example: '20:00'
      required:
      - name
      - username
      - password
      additionalProperties: true
    UserLogin:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    Location:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        aisle:
          type: string
        spot:
          type: string
        number:
          type: string
        active:
          type: boolean
        softDelete:
          type: boolean
      additionalProperties: true
